plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.cardkit'
version = '1.0.0'

android {
  namespace "expo.modules.cardkit"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // System document scanner (Google Play services module, D11) and its install-state check.
  implementation "com.google.android.gms:play-services-mlkit-document-scanner:16.0.0"
  // Text recognition (D13): Latin BUNDLED (in the APK, offline from the first launch); Chinese, Devanagari, Japanese,
  // Korean UNBUNDLED (Play services downloads each model once; AndroidManifest meta-data asks for them at install).
  implementation "com.google.mlkit:text-recognition:16.0.1"
  implementation "com.google.android.gms:play-services-mlkit-text-recognition-chinese:16.0.1"
  implementation "com.google.android.gms:play-services-mlkit-text-recognition-devanagari:16.0.1"
  implementation "com.google.android.gms:play-services-mlkit-text-recognition-japanese:16.0.1"
  implementation "com.google.android.gms:play-services-mlkit-text-recognition-korean:16.0.1"
  // Barcodes (SPEC §6.1): the BUNDLED model (in the APK, no Play-services download). 17.3.0 = latest on Google's
  // ML Kit release notes (2024-08-07), checked 2026-10-16.
  implementation "com.google.mlkit:barcode-scanning:17.3.0"
  // EXIF orientation of imported photos.
  implementation "androidx.exifinterface:exifinterface:1.4.1"
}
