appId: ${APP_ID}
---
# Back to the previous screen: Android's back key; iOS has none — the header back button (labelled with the previous
# screen's title, "Cards" for every screen opened from the list).
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Cards"
